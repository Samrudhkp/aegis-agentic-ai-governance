[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agentic-ai-governance"
version = "0.1.0"
description = "Agentic AI evaluation and governance platform using Google ADK and Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Aegis Contributors" }]
keywords = ["agents", "evaluation", "governance", "gemini", "adk", "safety"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "tenacity>=9.0.0",
  "python-json-logger>=2.0.7",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-gcp-trace>=1.7.0",
  "opentelemetry-exporter-gcp-monitoring>=1.7.0a0",
  "google-cloud-logging>=3.11.0",
  "google-cloud-bigquery>=3.27.0",
  "google-cloud-aiplatform>=1.71.0",
  "google-genai>=1.0.0",
  "click>=8.1.7",
  "rich>=13.9.0",
]

[project.optional-dependencies]
adk = ["google-adk>=1.0.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that call external services",
  "adversarial: adversarial safety regression suite",
]

[tool.ruff]
line-length = 100
target-version = "py311"
